[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nethawk"
version = "0.3.0"
description = "Reconstruct attacks from a packet capture. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SiteQ8" }]
keywords = [
  "security",
  "pcap",
  "network-security",
  "threat-hunting",
  "dfir",
  "incident-response",
  "blue-team",
  "ids",
  "cli",
  "forensics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/SiteQ8/NetHawk"
Repository = "https://github.com/SiteQ8/NetHawk"
Issues = "https://github.com/SiteQ8/NetHawk/issues"

[project.scripts]
nethawk = "nethawk.cli:main"

[tool.setuptools.packages.find]
include = ["nethawk*"]
